services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kazakhstan_travel
      POSTGRES_USER: kt_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kt_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - kt_pgdata:/var/lib/postgresql/data
      - ./packages/core/src/db/schema.postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kt_user -d kazakhstan_travel"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kt_user:${POSTGRES_PASSWORD:-kt_dev_password}@postgres:5432/kazakhstan_travel
    depends_on:
      postgres:
        condition: service_healthy

  telegram-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npm", "run", "bot:telegram"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kt_user:${POSTGRES_PASSWORD:-kt_dev_password}@postgres:5432/kazakhstan_travel
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kt_pgdata:
